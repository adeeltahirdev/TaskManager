<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <header class="header">
        <h1 class="heading">Task Manager</h1>
    </header>
    <div class="container">
        <div class="addCard">
            <input type="text" id="add" class="addTask" placeholder="Enter a task...">
            <button type="submit" id="submit" class="add-btn" onclick="add_task()">Add Task</button>
        </div>
        <div class="displayTask" id="display">
            <div class="nav">
                <button class="nav-items">All</button>
                <button class="nav-items">Active</button>
                <button class="nav-items">Completed</button>
                <div class="search">
                    <input type="search" id="search" class="search-box">
                    <button class="search-btn">Search</button>
                </div>
            </div>
            <ol class="tasks" id="taskList"></ol>
        </div>
    </div>
    <footer class="footer">
        <p class="task-count"><span class="f-span">0</span> Tasks</p>
        <button class="clear" id="clear-btn" onclick="clear_task()">Clear Tasks</button>
    </footer>
    
    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
